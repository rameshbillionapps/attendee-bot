version: '3.8'

services:
  postgres:
    image: postgres:15.3-alpine
    container_name: attendee-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-attendee_production}
      POSTGRES_USER: ${POSTGRES_USER:-attendee_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-attendee_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - attendee_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-attendee_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: attendee-redis
    networks:
      - attendee_network
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  attendee-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: attendee-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-attendee_production}
      POSTGRES_USER: ${POSTGRES_USER:-attendee_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-attendee_password}
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      DJANGO_SETTINGS_MODULE: attendee.settings.production
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      # Add other environment variables as needed
      DISABLE_EMAIL: ${DISABLE_EMAIL:-false}
      DJANGO_SSL_REQUIRE: ${DJANGO_SSL_REQUIRE:-false}
    networks:
      - attendee_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  attendee_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
